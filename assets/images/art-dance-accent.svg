<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="artGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
  </defs>

  <!-- Flowing dynamic ribbon representing dance movement -->
  <path d="M 30 180 C 100 80, 180 260, 260 140 C 310 60, 360 120, 380 90" 
        fill="none" stroke="url(#glowLine)" stroke-width="4" stroke-linecap="round"/>

  <!-- Secondary subtle wave -->
  <path d="M 20 150 C 90 230, 170 70, 250 180 C 300 240, 360 170, 390 200" 
        fill="none" stroke="#C084FC" stroke-width="2" stroke-dasharray="6 8" stroke-opacity="0.6"/>

  <!-- Musical & Creative Sparkle Particles -->
  <circle cx="95" cy="110" r="4" fill="#EC4899"/>
  <circle cx="180" cy="220" r="6" fill="#8B5CF6"/>
  <circle cx="260" cy="140" r="5" fill="#F43F5E"/>
  <circle cx="340" cy="95" r="4" fill="#A855F7"/>
  <circle cx="310" cy="210" r="3" fill="#FB7185"/>

  <!-- Stylized Dancing Ribbon/Petal Shape -->
  <path d="M 190 80 C 230 60, 270 100, 250 140 C 220 190, 150 160, 160 120 C 165 95, 175 85, 190 80 Z" 
        fill="url(#artGrad1)" opacity="0.25"/>
</svg>
